<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20382f"><link rel="manifest" href="manifest.webmanifest"><title>JISEN CERAMICS · Mobile Capture</title><link rel="stylesheet" href="mobile.css"><script src="pricing.js" defer></script><script src="capture-core.js" defer></script><script src="mobile-store.js" defer></script><script src="vendor/jszip.min.js" defer></script><script src="transfer.js" defer></script><script src="mobile.js" defer></script></head>
<body>
<header class="mobile-head"><div class="mini">己森｜日本の器</div><h1>JISEN CERAMICS</h1><p>Mobile Capture · 现场采集</p></header>
<main>
  <section id="homeView" class="view"><div class="home-intro"><span class="eyebrow">CURRENT BATCH</span><h2 id="homeBatch">加载中</h2><p id="homeBatchTime"></p></div><div class="stats"><div><strong id="statDraft">0</strong><span>待处理</span></div><div><strong id="statReady">0</strong><span>已完成</span></div><div><strong id="statReview">0</strong><span>待老板审核</span></div><div><strong id="statTotal">0</strong><span>本批次</span></div></div><div class="home-actions"><button id="newProduct" class="primary">＋ 录入新器物</button><button id="copyPrevious">复制上一件器物信息</button><button id="continueDraft">继续未完成</button><button id="openBatch">查看本批次</button><button id="exportBatch">导出本批次</button><button id="openMobileSettings">设置</button></div><p id="homeStatus" class="status" role="status"></p></section>
  <section id="captureView" class="view" hidden><div class="view-bar"><button data-go="home">← 返回</button><span id="captureBadge" class="badge">未完成</span></div><h2>单件采集</h2><p class="small" id="captureBatch"></p><label class="field priority">SKU<input id="mSku" type="text" autocomplete="off" placeholder="JC-0231 · 可暂时留空"></label><section class="card"><h3>照片</h3><div id="photoSlots"></div></section><section class="card"><h3>基础信息</h3><div id="basicFields"></div></section><details class="card"><summary>高级信息与定价因素</summary><div id="advancedFields"></div></details><section class="card price-card"><h3>规则建议价</h3><div id="priceSummary"></div><details><summary>为什么是这个价？</summary><div id="priceExplanation"></div></details><label class="field">暂定售价（PC 导入后仍可修改）<input id="mPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="人工填写"></label><button id="useSuggested">采用建议价</button></section><section class="card"><label class="check"><input id="mOwnerReview" type="checkbox">提交老板审核</label><p id="reviewReasons" class="small"></p><label class="field">备注<textarea id="mNote" rows="3" placeholder="箱书、落款、异常等"></textarea></label><button id="mobileResearch">AI 辅助调查</button></section><div class="bottom-actions"><button id="saveCapture">保存</button><button id="saveNext" class="primary">保存并下一件</button></div><p id="captureStatusMessage" class="status" role="status"></p></section>
  <section id="batchView" class="view" hidden><div class="view-bar"><button data-go="home">← 返回</button></div><h2>本批次</h2><div id="batchMeta"></div><div class="row-actions"><button id="newBatch">新建批次</button><button id="endBatch">结束批次</button><button id="batchExport">导出本批次</button></div><div id="batchProducts"></div><p id="batchStatus" class="status" role="status"></p></section>
  <section id="mobileSettingsView" class="view" hidden><div class="view-bar"><button data-go="home">← 返回</button></div><h2>设置与备份</h2><div id="mobileSettingsContent"></div></section>
</main><dialog id="mobilePhotoDialog"><button id="closePhoto">关闭</button><img id="largePhoto" alt="商品照片大图"></dialog><dialog id="mobileResearchDialog"><button id="closeMobileResearch">关闭</button><h2>AI 辅助调查</h2><div id="mobileResearchContent"></div></dialog>
</body></html>
